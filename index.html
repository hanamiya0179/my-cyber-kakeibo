<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER KAKEIBO</title>
    <!-- 🎨 読み込むCSSファイル -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- 🌌 アプリのコンテナ（全体を囲む枠） -->
    <div class="app-container">
        
        <!-- 🚀 メインヘッダー（すべての画面で共通で上に表示） -->
        <header class="cyber-header">
            <h1>CYBER WALLET</h1>
            <div class="total-box">
                <span class="total-label">MONTHLY EXPENSE</span>
                <div class="total-amount">¥ <span id="total-price">0</span></div>
            </div>
        </header>

        <!-- ＝★＝★＝ 5つの画面の定義 ＝★＝★＝ -->

        <!-- 🏠 1. ホーム画面 -->
        <div id="home-screen" class="app-screen active">
            <section class="input-section">
                <h2>NEW TRANSACTION</h2>
                <form id="kakeibo-form">
                    <div class="form-group">
                        <label for="amount">AMOUNT (円)</label>
                        <input type="number" id="amount" placeholder="金額を入力..." required min="1">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">CATEGORY</label>
                        <select id="category" required>
                            <option value="" disabled selected>選択してください...</option>
                            <option value="食費">食費</option>
                            <option value="固定費">固定費</option>
                            <option value="日用品">日用品</option>
                            <option value="ゲーム・趣味">ゲーム・趣味</option>
                            <option value="交際費">交際費</option>
                            <option value="貯金">貯金</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">DATE</label>
                        <input type="date" id="date" class="cyber-date-picker" required>
                    </div>
                    <div class="form-group">
                        <label for="memo">MEMO</label>
                        <input type="text" id="memo" placeholder="（例：モンストのガチャ、おやつ など）">
                    </div>
                    <button type="submit" id="submit-btn" class="cyber-btn">ADD TRANSACTION</button>
                </form>
            </section>
        </div>

        <!-- 📋 2. ログ画面 -->
        <div id="log-screen" class="app-screen">
            <section class="history-section">
                <h2>HISTORY LOG</h2>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="month-filter">SELECT MONTH (表示する月を選択)</label>
                    <select id="month-filter">
                    </select>
                </div>
                <div id="history-list" class="history-list">
                    <p id="empty-message" class="empty-message">履歴はありません</p>
                </div>
            </section>
        </div>

        <!-- 💰 3. 給与画面 -->
        <div id="salary-screen" class="app-screen">
            <section class="salary-section">
                <h2>SALARY MANAGEMENT</h2>
                <div class="balance-box">
                    <span class="total-label">REMAINING BUDGET (残金)</span>
                    <div class="balance-amount">¥ <span id="balance-price">0</span></div>
                </div>
                <form id="salary-form">
                    <div class="form-group" style="margin-top: 20px;">
                        <label for="salary-amount">MONTHLY INCOME (毎月の手取り金額)</label>
                        <input type="number" id="salary-amount" placeholder="手取りの金額を入力..." required min="0">
                    </div>
                    <button type="submit" id="salary-submit-btn" class="cyber-btn">SET INCOME</button>
                </form>
            </section>
        </div>

        <!-- 🎲 4. ガチャ画面 -->
        <div id="gacha-screen" class="app-screen">
            <section class="gacha-section">
                <h2>CYBER GACHA</h2>
                <div class="gacha-tab-container">
                    <button class="gacha-tab-btn active" data-gacha="fortune">占い</button>
                    <button class="gacha-tab-btn" data-gacha="luxury">プチ贅沢</button>
                </div>

                <div class="total-box" style="margin-bottom: 30px; text-align: center; min-height: 100px; display: flex; justify-content: center; align-items: center;">
                    <div id="gacha-result" style="font-size: 18px; font-weight: bold; color: var(--text-main);">
                        今日の運勢を占おう！ボタンを押してね！
                    </div>
                </div>
                <button id="gacha-btn">シングルガチャ</button>
            </section>
        </div>

        <!-- ⚙️ 5. 設定画面（★シフト制・1日ずつ選べる休日選択へアップデート！） -->
        <div id="settings-screen" class="app-screen">
            <section class="theme-section">
                <h2>THEME CONFIG</h2>
                <p class="theme-intro">お好みのシステムスキンを選択してください</p>
                
                <div class="theme-grid" style="margin-bottom: 30px;">
                    <button class="theme-btn theme-cyber" data-theme="cyber">
                        <span class="theme-icon">👾</span> CYBER
                    </button>
                    <button class="theme-btn theme-cafe" data-theme="cafe">
                        <span class="theme-icon">☕</span> CAFE
                    </button>
                    <button class="theme-btn theme-pop" data-theme="pop">
                        <span class="theme-icon">🍓</span> POP
                    </button>
                    <button class="theme-btn theme-light" data-theme="light">
                        <span class="theme-icon">🏢</span> LIGHT
                    </button>
                </div>

                <!-- 💡 【新設計】シフト制対応：2つの休日を完全にバラバラに設定できるドロップダウン -->
                <h2>HOLIDAY SETTING</h2>
                <p class="theme-intro">プチ贅沢ガチャを解放する休日を2日選んでください</p>
                <div class="form-group">
                    <label>1日目の休日</label>
                    <select id="holiday-select-1">
                        <option value="6">土曜日</option>
                        <option value="0">日曜日</option>
                        <option value="1">月曜日</option>
                        <option value="2">火曜日</option>
                        <option value="3">水曜日</option>
                        <option value="4">木曜日</option>
                        <option value="5">金曜日</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 10px;">
                    <label>2日目の休日</label>
                    <select id="holiday-select-2">
                        <option value="0">日曜日</option>
                        <option value="6">土曜日</option>
                        <option value="1">月曜日</option>
                        <option value="2">火曜日</option>
                        <option value="3">水曜日</option>
                        <option value="4">木曜日</option>
                        <option value="5">金曜日</option>
                    </select>
                </div>
            </section>
        </div>

    </div>

    <!-- 📱 画面最下部に固定される5つのサイバーメニューバー -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="home-screen">
            <span class="nav-icon">⌂</span>
            <span class="nav-text">ホーム</span>
        </button>
        <button class="nav-item" data-target="log-screen">
            <span class="nav-icon">▤</span>
            <span class="nav-text">ログ</span>
        </button>
        <button class="nav-item" data-target="salary-screen">
            <span class="nav-icon">¥</span>
            <span class="nav-text">給与</span>
        </button>
        <button class="nav-item" data-target="gacha-screen">
            <span class="nav-icon">⬡</span>
            <span class="nav-text">ガチャ</span>
        </button>
        <button class="nav-item" data-target="settings-screen">
            <span class="nav-icon">⛭</span>
            <span class="nav-text">オプション</span>
        </button>
    </nav>

    <!-- 🧠 JavaScriptファイルの読み込み -->
    <script src="./js/script.js"></script>
</body>
</html>
